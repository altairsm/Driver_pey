server {
    listen 80;
    server_name localhost;

    client_max_body_size 200M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Politica de privacidade como HTML estatico: o Google Play busca o texto
    # no HTML puro, sem executar JavaScript. A rota da SPA existe para o app.
    location = /privacidade {
        try_files /privacidade.html =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ garante que /api/ tenha precedencia sobre qualquer regex futura.
    location ^~ /api/ {
        proxy_pass http://backend:3001/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
