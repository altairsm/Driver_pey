services:
  postgres:
    image: postgres:16-alpine
    container_name: driver-pey-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: jadlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PUhgB0AZWAfhfm9qFe0sDcLzQG09hTGLkSC3eOa66e333b7b
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        VERSION: ${VERSION:-unknown}
    container_name: driver-pey-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jadlog
      DB_USER: postgres
      DB_PASS: PUhgB0AZWAfhfm9qFe0sDcLzQG09hTGLkSC3eOa66e333b7b
      JWT_SECRET: 0e560c48d422acdbf0b106df4dc154c5
      GOOGLE_MAPS_API_KEY: AIzaSyArrv1bWt3ye29tPLyDkj38qc6P70jCctM
      # Base publica do servidor. Monta a URL de download do APK que
      # vai para a tabela versao_apk. Aponte para o dominio real quando
      # o acesso nao for por proxy (ou https).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://driverpix.intuitiva.log.br}
      # Chave mestra da NFS-e (AES-256-GCM). Vem do .env da VPS, fora do Git.
      # Vazia = o backend deriva de JWT_SECRET e mostra aviso na tela de Configuracoes.
      NFSE_MASTER_KEY: ${NFSE_MASTER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      # APK enviado pelo admin mora em /app/uploads. Sem este volume o
      # "docker compose up -d" recria o container e o APK some — o que
      # fazia o download falhar logo apos qualquer deploy. Nomeado (e nao
      # bind mount) porque o padrao do Docker sobrevive a rm do container.
      - apkdata:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        VERSION: ${VERSION:-unknown}
    container_name: driver-pey-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  apkdata:
